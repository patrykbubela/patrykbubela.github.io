baseURL: "https://patrykbubela.github.io/"
locale: en-uk
title: Patryk Bubeła
theme: ["PaperMod"]
pluralizeListTitles: false
params:
  ShowShareButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  homeInfoParams:
    Title: Hello!
    Content: My name is Patryk Bubeła and I am a Telecommunications engineering student at the Faculty of Electronics and Information Technology, Warsaw University of Technology.
  socialIcons:
    - name: "GitHub"
      url: "https://github.com/patrykbubela"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/patryk-bubela"
  mainSections:
    - projects
caches:
  images:
    dir: :cacheDir/images
outputs:
  home:
    - HTML
    - RSS
    - JSON
menus:
  main:
    - name: Projects
      pageRef: /
      weight: 10
    - name: Blog
      pageRef: /blog/
      weight: 20
    - name: Search
      url: /search/
      weight: 100
