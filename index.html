    <script type="text/javascript">
        var clicks = 0;
        const targetBtn = document.getElementById('button1')
        let currentSize1 = 75;
        let currentSize2 = 50;
        let currentSize3 = 20;
        function onClick() {
            clicks += 1;
            targetBtn.style.width = currentSize1*(clicks+1) + 'px';

            targetBtn.style.fontSize = currentSize3*(clicks+1) + 'px';
