        :root {
            --color1: grey;
        }
        @font-face {
        font-family: "MAGNETOB";
        src: url("MAGNETOB.TTF");
        }
        body {
            height: 100%;
            font-family: "MAGNETOB";
            font-size: 5vw;
            background-color: black;
            overflow: hidden;
            color: silver;
            text-shadow:
                -2px -2px 0 grey,

            color: silver;
            border-radius: 5px;
            padding: 15px;
            text-shadow:
                -2px -2px 0 var(--color1),
                2px -2px 0 var(--color1),
                -2px 2px 0 var(--color1),
                2px 2px 0 var(--color1),
                -3px 0px 0 var(--color1),
                3px 0px 0 var(--color1),
                0px -3px 0 var(--color1),
                0px 3px 0 var(--color1);
        }
        button:hover {background-color: grey;color: white;--color1:silver}
        .backvideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            transform: translateX(calc((100% - 100vw) / 2));
            z-index: -1;
            opacity: 0.25;
        }
        ul

            list-style-type: none;
        }
